<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Facebook_Login_Clone</title>
</head>

<body>
    <div class="container">

        <section class="left-section">

            <img class="logo" src="images/facebook-logo.png">
            
            <div class="left-content">
                
                <h1>
                    
                    Explore <br>
                    the things <br>
                    <span>you love.</span>
                    
                </h1>
                
                <img class="hero-image" src="images/facebook-img.webp">
                
            </div>
            
        </section>
        
        
        <section class="right-section">

            <div class="right-logo">
                <img class="logo2" src="images/facebook-logo.png">
            </div>
            
            <header>Log in to facebook</header>

            <input type="text" placeholder="Email address or mobile number">

            <input type="password" placeholder="Password">

            <button class="log-in">Log in</button>

            <button class="forgot">Forgot Password?</button>

            <button class="create">Create new account</button>

            <p><i class="fa-brands fa-meta"></i> Meta</p>
        </section>
    </div>
</body>

</html>

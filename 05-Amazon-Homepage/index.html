<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.in: Online Shopping India</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <a href="#" class="nav-logo border">
                <i class="fa-solid fa-bars"></i>
                <img src="images/amazon-logo.png" alt="Amazon">
            </a>

            <div class="location border">
                <i class="fa-solid fa-location-dot"></i>

                <div class="location-text">
                    <span class="location-top">Delivering to Delhi 110076</span>
                    <span class="location-bottom">Update location</span>
                </div>
            </div>



            <section class="searchbar">

                <select id="category">
                    <option>All Category</option>
                    <option>Alexa Skills</option>
                    <option>Amezon Devices</option>
                    <option>Amezon Fashion</option>
                    <option>Amezon Pharmacy</option>
                </select>

                <input type="text" placeholder="Search Amezon.in">
                <button class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></button>

            </section>

            <div class="language border">
                <img src="images/india-flag.png" alt="India Flag">

                <select>
                    <option>Eng</option>
                    <option>Hin</option>
                </select>

            </div>

            <a href="#" class="nav-sign border">
                <span class="sign-top">Hello, sign in</span>
                <span class="sign-bottom">Account & Lists</span>
            </a>


            <a href="#" class="nav-return border">
                <span class="return-top">Returns</span>
                <span class="return-bottom">& Orders</span>
            </a>

            <a href="#" class="login">
                <p>Sign in <i class="fa-solid fa-user"></i></p>
            </a>

            <a class="cart border" href="#">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Cart</span>
            </a>
        </nav>
    </header>

    <main class="container">

        <section class="buttons">
            <button class="btn">
                <i class="fa-solid fa-bars"></i> All</button>
            <button class="btn">Fresh</button>
            <button class="btn">Prime Video</button>
            <button class="btn">Sell</button>
            <button class="btn">Bestsellers</button>
            <button class="btn">Today's Deals</button>
            <button class="btn">Mobiles</button>
            <button class="btn">New Releases</button>
            <button class="btn">Prime</button>
            <button class="btn">Amezon Pay</button>
            <button class="btn">Electronics</button>
            <button class="btn">Customer Service</button>
            <button class="btn">Home & Kitchen</button>
            <button class="btn">Fashion</button>
            <button class="btn">Computers</button>
        </section>

        <section class="hero-section">

            <div class="product-details">
                <img src="images/Product1.png" alt="">
                <img src="images/Product2.png" alt="">
                <img src="images/Product3.png" alt="">
                <img src="images/Product4.png" alt="">
            </div>

        </section>

    </main>


</body>

</html>

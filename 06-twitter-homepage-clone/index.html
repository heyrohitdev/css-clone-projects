<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Twitter Homepage Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <div class="top">
            <img src="twitter.png" alt="Twitter Logo">
            <h1>See What's  happpening</h1>
        </div>

        <section class="left">
            <h1>Happening now.</h1>

            <div class="content">
                <div class="buttons">
                    <button class="btn phone-btn">
                        <i class="fa-solid fa-phone"></i>
                         Continue with phone
                    </button>
                    <button class="btn" google-btn>
                        <img src="google.png" alt="">
                        Continue with Google
                    </button>
                    <button class="btn" apple-btn>
                        <i class="fa-brands fa-apple"></i>
                         Cotinue with Apple
                    </button>
                </div>

                <div class="line">
                    <span>or</span>
                </div>

                <input
                    type="text"
                    placeholder="Email or username"
                    ="username">

                <button class="btn continue-btn">Continue</button>

                <div class="privacy">
                    <span>By cotinuing, you agree to our</span>
                    <span>Term of Service, Privacy Policy</span>
                    <span>and</span>
                    <span>Cookie use</span>
                </div>

            </div>
        </section>

        <section class="right">
            <img src="twitter.png" alt="Twitter X Logo">
        </section>
    </main>
</body>

</html>
